# 哔哩哔哩 —— 人工增补与修正
#
# 这里把上游 B站 规则里两条「不是广告、但可能影响播放」的规则从默认模块移出，
# 想用的人自己去掉行首的 # 即可。

# ---- 已从默认模块移出的规则（原因见下）----
#
# 1) 屏蔽 IP / 地区探测请求
#    上游注释是「屏蔽IP请求」。它会拦掉 App 用来判断所在地区与网络环境的接口，
#    被 404 之后 App 可能认为网络异常，影响播放地址与地区逻辑。
#    收益：少一次地区探测；风险：影响播放。所以默认不开。
#^https?:\/\/app\.bilibili\.com\/x\/resource\/ip - reject
#
# 2) gRPC 搜索默认词
#    这是 app.bilibili.com 上的一个 gRPC 调用（bilibili.app.interface.v1.Search/Default），
#    用普通 reject 直接杀掉 gRPC 请求，App 侧错误处理未必友好。
#    收益：搜索框不显示默认词/热搜；风险：搜索页出现异常。默认不开。
#^https?:\/\/app\.bilibili\.com\/bilibili\.app\.interface\.v1\.Search\/Default - reject

# ---- 开屏广告：改成不依赖 JS 脚本的硬拦 ----
# 上游（deezertidal / app2smile）的做法是：splash/show 用 reject-dict，splash/list 交给
# bilibili-json.js 脚本清理。问题是脚本依赖小火箭的 JS 引擎和参数支持，脚本没跑起来时
# splash/list 就照常返回广告数据 → 开屏广告还在。
# 这里直接对整个 splash 命名空间硬拦（返回空 JSON 对象 = 没有开屏广告素材）：
^https?:\/\/app\.bilibili\.com\/x\/v2\/splash\/ - reject-dict
