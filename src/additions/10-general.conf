# 通用 App 去广告 —— 人工增补与修正
#
# 本文件的规则会与 src/rewrite/10-general.conf 合并（同一 pattern 去重）。
# 原则：只补“确定是广告”的端点，不做“万能模糊匹配”，避免误伤 App 正常功能。
#
# 语法：`^正则 - 动作`；动作取 Shadowrocket 的 reject / reject-200 / reject-dict / reject-img

# ---- 修正上游写错动作而失效的规则（原来整条不生效）----
# 百视TV 开屏图：上游写成 `url reject-20`（非法动作），图片请求改用 reject-img 返回 1px 图
^https?:\/\/bp-image\.bestv\.com\.cn\/[a-zA-Z0-9]{8}-[a-zA-Z0-9]{4}-[a-zA-Z0-9]{4}-[a-zA-Z0-9]{4}-[a-zA-Z0-9]{25}\.jpg - reject-img
# 中国移动云盘：上游写成 `- reject-d`（非法动作），应为 reject-dict
^https?:\/\/ad\.mcloud\.139\.com\/advertapi\/adv-filter\/adv-filter\/AdInfoFilter\/getAdInfos - reject-dict

# ---- 说明：为什么这里没有“万能开屏正则” ----
# 试过一组 `^https?://(ad|ads|splash)[\w-]*\.(alicdn|byteimg|qpic|...)/...` 的通用规则，
# 但它 ①要求把 ad*.alicdn.com、ad*.byteimg.com 等一大批 CDN 加进 MITM，解密范围过大；
# ②这类 CDN 上正常业务图也可能命中 `ad` 前缀。因此改为只保留“明确是广告接口”的上游规则，
# 开屏广告主要交给 [URL Rewrite] 里各 App 的精确端点 + [Rule] 里的广告域名拦截。

# ---- 可选：更激进的信息流/推广拦截（默认关闭，按需去掉行首 # 启用）----
# 注意：下列规则会连带屏蔽“可能感兴趣的人 / 猜你喜欢”等模块，可能影响正常浏览体验
#^https?:\/\/[\w.-]+\/[\w/]*\/(recommend|rcmd|feed)[\w/]*\/ad[\w/]*(\?|$) - reject-dict
#^https?:\/\/[\w.-]+\/[\w/]*\/ad(s|v)?\/[\w/]*\/(list|config|info|position)(s)?(\?|$) - reject-dict

# ---- 修正上游写错的域名（原规则 `res\.kfc\.com.\cn` 无法匹配任何真实域名）----
^https?:\/\/res\.kfc\.com\.cn\/advertisement\/ - reject
